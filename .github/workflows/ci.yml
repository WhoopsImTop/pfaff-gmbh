name: Deploy website on push

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Build static site
        run: |
          npm ci
          ESLINT=false NODE_ENV=production npm run generate

      - name: Create deployment archive
        run: |
          cd dist
          zip -r ../deploy.zip .

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Strato via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_SERVER }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          DEPLOY_DIR: pfaff-nuxt-2026-test
        run: |
          mkdir -p ~/.ssh
          cat >> ~/.ssh/config << EOF
          Host strato-deploy
            HostName ${SSH_HOST}
            User ${SSH_USER}
            Port 22
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

          scp deploy.zip strato-deploy:deploy.zip

          ssh strato-deploy bash -s << EOF
            set -e
            rm -rf ${DEPLOY_DIR}/*
            mkdir -p ${DEPLOY_DIR}
            unzip -o deploy.zip -d ${DEPLOY_DIR}
            rm -f deploy.zip
          EOF

          rm -f deploy.zip
