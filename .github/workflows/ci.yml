name: Deploy website on push

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Build static site
        run: |
          npm ci
          ESLINT=false NODE_ENV=production npm run generate

      - name: Create deployment archive
        run: |
          cd dist
          zip -r ../deploy.zip .

      - name: Deploy to Strato via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_DIR: pfaff-nuxt-2026-test
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 "$SSH_HOST" >> ~/.ssh/known_hosts

          scp -P 22 -i ~/.ssh/id_rsa deploy.zip "${SSH_USER}@${SSH_HOST}:deploy.zip"

          ssh -p 22 -i ~/.ssh/id_rsa "${SSH_USER}@${SSH_HOST}" bash -s << EOF
            set -e
            rm -rf ${DEPLOY_DIR}/*
            mkdir -p ${DEPLOY_DIR}
            unzip -o deploy.zip -d ${DEPLOY_DIR}
            rm -f deploy.zip
          EOF

          rm -f deploy.zip
