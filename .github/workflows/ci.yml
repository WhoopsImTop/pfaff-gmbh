name: Deploy website on push

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Build static site
        run: |
          npm ci
          ESLINT=false NODE_ENV=production npm run generate:optimized

      - name: Create deployment archive
        run: |
          cd dist
          zip -r ../deploy.zip .

      - name: Deploy to Strato via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_SERVER }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          DEPLOY_DIR: pfaff-nuxt-2026
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

          cat > ~/.ssh/config << EOF
          Host strato-deploy
            HostName ${SSH_HOST}
            User ${SSH_USER}
            Port 22
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

          ssh -o BatchMode=yes strato-deploy "echo SSH connection OK"

          scp deploy.zip strato-deploy:deploy.zip

          ssh strato-deploy bash -s << EOF
            set -e
            rm -rf ${DEPLOY_DIR}/*
            mkdir -p ${DEPLOY_DIR}
            unzip -o deploy.zip -d ${DEPLOY_DIR}
            rm -f deploy.zip
          EOF

          rm -f deploy.zip
